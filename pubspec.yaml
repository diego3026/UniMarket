name: unimarket
description: "UniMarket: marketplace de emprendedores de la Universidad del Magdalena."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado y Arquitectura
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Navegación
  go_router: ^13.0.1

  # Inyección de dependencias
  get_it: ^7.6.4

  # Datos
  dio: ^5.4.0
  shared_preferences: ^2.2.2

  # UI y Utilidades
  intl: ^0.20.2
  dartz: ^0.10.1
  google_fonts: ^6.2.1

  # Mapas y Ubicación
  google_maps_flutter: ^2.5.0
  geolocator: ^9.0.2
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.10.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/LOGO_UNIMARKET.png"

